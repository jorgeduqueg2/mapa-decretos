vipola": "15759", "lat": 5.723976, "lon": -72.924355, "estado": "Decreto Municipal Sancionado", "corte": "21 de Octubre de 2026"}];
    const markersGroup = L.layerGroup();
    const markersMap = {};

    mpiosData.forEach((item, idx) => {
      const marker = L.circleMarker([item.lat, item.lon], {
        radius: 8,
        fillColor: '#dc2626',
        color: '#ffffff',
        weight: 2.5,
        opacity: 1,
        fillOpacity: 0.95
      });

      // Popup
      const popupHtml = `
        <div class="popup-header">
          <h3>${item.municipio}</h3>
          <span>${item.departamento}</span>
        </div>
        <div class="popup-body">
          <div class="popup-row">
            <span class="popup-label">Código DIVIPOLA</span>
            <span class="popup-val">${item.divipola}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Acto Administrativo</span>
            <span class="status-tag">${item.estado}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Corte Oficial</span>
            <span class="popup-val">${item.corte}</span>
          </div>
        </div>
      `;
      marker.bindPopup(popupHtml);

      // Tooltip Hover
      const tooltipHtml = `
        <strong style="color: #f87171;">${item.municipio}</strong> (${item.departamento})<br>
        <span style="font-size: 11px; opacity: 0.9;">Decreto SINEFAC: Sancionado</span>
      `;
      marker.bindTooltip(tooltipHtml, {
        className: 'custom-tooltip',
        direction: 'top',
        offset: [0, -6]
      });

      markersGroup.addLayer(marker);
      markersMap[idx] = { marker: marker, data: item };
    });

    markersGroup.addTo(map);

    // 5. Control de Capas
    const baseLayers = {
      "Mapa Claro": layerClaro,
      "Vista Satelital": layerSatelite,
      "OpenStreetMap": layerOSM
    };

    const overlayLayers = {
      "126 Municipios con Decreto": markersGroup,
      "Departamentos de Colombia": layerDeptos
    };

    L.control.layers(baseLayers, overlayLayers, {
      position: 'topright',
      collapsed: false
    }).addTo(map);

    // 6. Leyenda Flotante
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend-panel');
      div.innerHTML = `
        <div class="legend-title">Decretos SINEFAC (Corte Octubre 2026)</div>
        <div class="legend-item">
          <div class="legend-dot" style="background: #dc2626;"></div>
          <span>Municipios con Decreto Sancionado (<b>126</b>)</span>
        </div>
        <div class="legend-item">
          <div class="legend-poly" style="background: #bae6fd;"></div>
          <span>Departamentos de Colombia</span>
        </div>
      `;
      return div;
    };
    legend.addTo(map);

    // 7. Buscador Interactivo
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    function normalizeText(text) {
      return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    searchInput.addEventListener('input', function() {
      const val = normalizeText(this.value.trim());
      searchResults.innerHTML = '';
      if (!val) {
        searchResults.style.display = 'none';
        return;
      }

      const matches = mpiosData.map((item, idx) => ({ item, idx }))
        .filter(m => normalizeText(m.item.municipio).includes(val) || normalizeText(m.item.departamento).includes(val))
        .slice(0, 8);

      if (matches.length === 0) {
        searchResults.innerHTML = '<div style="padding: 8px 12px; font-size: 12px; color: #94a3b8;">Sin resultados</div>';
        searchResults.style.display = 'block';
        return;
      }

      matches.forEach(m => {
        const row = document.createElement('div');
        row.className = 'search-item';
        row.innerHTML = `
          <span><b>${m.item.municipio}</b></span>
          <span class="search-item-dept">${m.item.departamento}</span>
        `;
        row.addEventListener('click', function() {
          const target = markersMap[m.idx].marker;
          map.flyTo([m.item.lat, m.item.lon], 11, { duration: 1.2 });
          setTimeout(() => { target.openPopup(); }, 1200);
          searchResults.style.display = 'none';
          searchInput.value = `${m.item.municipio} (${m.item.departamento})`;
        });
        searchResults.appendChild(row);
      });

      searchResults.style.display = 'block';
    });

    document.addEventListener('click', function(e) {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    });
  </script>
